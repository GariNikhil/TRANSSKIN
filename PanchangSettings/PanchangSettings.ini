[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowX=100
WindowY=100
Draggable=1
KeepOnScreen=1
AlwaysOnTop=0
ClickThrough=0
BackgroundMode=2
SolidColor=18,18,22,245
OnRefreshAction=[!Show][!ZPos 0][!Move 100 100 "#CURRENTCONFIG#"][!UpdateMeter *][!Redraw]

[Variables]
@Include=#ROOTCONFIGPATH#\@Settings\Variables.inc

SettingsWidth=430
SettingsLabelColor=220,220,225,210
SettingsValueColor=255,255,255,255
SettingsMutedColor=180,180,190,190
SettingsAccent=94,169,255,255
SettingsInputBackground=42,42,50,255

[MeasureInputCountry]
Measure=Plugin
Plugin=InputText
X=175
Y=68
W=230
H=25
SolidColor=#SettingsInputBackground#
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
AntiAlias=1
TopMost=0
FocusDismiss=0
DefaultValue="#PANCHANG_COUNTRY#"
Command1=[!WriteKeyValue Variables PANCHANG_COUNTRY "$UserInput$" "#ROOTCONFIGPATH#\@Settings\Variables.inc"]
Command2=[!Refresh "#CURRENTCONFIG#"]

[MeasureInputPanchangFontColor]
Measure=Plugin
Plugin=InputText
X=175
Y=173
W=230
H=25
SolidColor=#SettingsInputBackground#
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
AntiAlias=1
TopMost=0
FocusDismiss=0
DefaultValue="#PANCHANG_FONT_COLOR#"
Command1=[!WriteKeyValue Variables PANCHANG_FONT_COLOR "$UserInput$" "#ROOTCONFIGPATH#\@Settings\Variables.inc"]
Command2=[!Refresh "#CURRENTCONFIG#"]

[MeasureInputCity]
Measure=Plugin
Plugin=InputText
X=175
Y=103
W=230
H=25
SolidColor=#SettingsInputBackground#
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
AntiAlias=1
TopMost=0
FocusDismiss=0
DefaultValue="#PANCHANG_CITY#"
Command1=[!WriteKeyValue Variables PANCHANG_CITY "$UserInput$" "#ROOTCONFIGPATH#\@Settings\Variables.inc"]
Command2=[!Refresh "#CURRENTCONFIG#"]

[MeasureInputTimezone]
Measure=Plugin
Plugin=InputText
X=175
Y=138
W=230
H=25
SolidColor=#SettingsInputBackground#
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
AntiAlias=1
TopMost=0
FocusDismiss=0
DefaultValue="#PANCHANG_TIMEZONE#"
Command1=[!WriteKeyValue Variables PANCHANG_TIMEZONE "$UserInput$" "#ROOTCONFIGPATH#\@Settings\Variables.inc"]
Command2=[!Refresh "#CURRENTCONFIG#"]

[MeasureUpdatePanchang]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#ROOTCONFIGPATH#\tools\panchang\update-panchang.ps1" -RefreshRainmeter
State=Hide
FinishAction=[!RefreshApp][!DeactivateConfig "#CURRENTCONFIG#"]

[MeasureUpdateAmavasya]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#ROOTCONFIGPATH#\tools\panchang\update-panchang.ps1" -Region south-indian -MonthStart amavasya -RefreshRainmeter
State=Hide
FinishAction=[!RefreshApp][!DeactivateConfig "#CURRENTCONFIG#"]

[MeasureUpdatePurnima]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#ROOTCONFIGPATH#\tools\panchang\update-panchang.ps1" -Region north-indian -MonthStart purnima -RefreshRainmeter
State=Hide
FinishAction=[!RefreshApp][!DeactivateConfig "#CURRENTCONFIG#"]

[MeasureMonthStart]
Measure=String
String=#PANCHANG_MONTH_START#
DynamicVariables=1
IfMatch=^amavasya$
IfMatchAction=[!SetOption AmavasyaButton SolidColor 55,105,170,255][!SetOption PurnimaButton SolidColor 70,70,82,255][!UpdateMeter AmavasyaButton][!UpdateMeter PurnimaButton][!Redraw]
IfNotMatchAction=[!SetOption AmavasyaButton SolidColor 70,70,82,255][!SetOption PurnimaButton SolidColor 55,105,170,255][!UpdateMeter AmavasyaButton][!UpdateMeter PurnimaButton][!Redraw]

[Panel]
Meter=Shape
Shape=Rectangle 0,0,#SettingsWidth#,485,10 | Fill Color 18,18,22,245 | StrokeWidth 1 | Stroke Color 80,80,95,255

[Title]
Meter=String
X=22
Y=12
FontFace=Open Sans Light
FontSize=18
FontColor=#SettingsValueColor#
StringStyle=Bold
AntiAlias=1
Text=PANCHANG SETTINGS

[Subtitle]
Meter=String
X=22
Y=40
FontFace=Open Sans
FontSize=9
FontColor=#SettingsMutedColor#
AntiAlias=1
Text=Edit a field, press Enter, then click SAVE & REFRESH.

[CountryLabel]
Meter=String
X=22
Y=68
FontFace=Open Sans
FontSize=10
FontColor=#SettingsLabelColor#
AntiAlias=1
Text=COUNTRY

[CountryValue]
Meter=String
X=175
Y=68
W=230
H=25
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
SolidColor=#SettingsInputBackground#
Padding=6,4,6,4
AntiAlias=1
Text=#PANCHANG_COUNTRY#
LeftMouseUpAction=[!CommandMeasure "MeasureInputCountry" "ExecuteBatch 1-2"]

[CityLabel]
Meter=String
X=22
Y=103
FontFace=Open Sans
FontSize=10
FontColor=#SettingsLabelColor#
AntiAlias=1
Text=CITY

[CityValue]
Meter=String
X=175
Y=103
W=230
H=25
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
SolidColor=#SettingsInputBackground#
Padding=6,4,6,4
AntiAlias=1
Text=#PANCHANG_CITY#
LeftMouseUpAction=[!CommandMeasure "MeasureInputCity" "ExecuteBatch 1-2"]

[TimezoneLabel]
Meter=String
X=22
Y=138
FontFace=Open Sans
FontSize=10
FontColor=#SettingsLabelColor#
AntiAlias=1
Text=TIMEZONE

[TimezoneValue]
Meter=String
X=175
Y=138
W=230
H=25
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
SolidColor=#SettingsInputBackground#
Padding=6,4,6,4
AntiAlias=1
Text=#PANCHANG_TIMEZONE#
LeftMouseUpAction=[!CommandMeasure "MeasureInputTimezone" "ExecuteBatch 1-2"]

[PanchangFontColorLabel]
Meter=String
X=22
Y=173
FontFace=Open Sans
FontSize=10
FontColor=#SettingsLabelColor#
AntiAlias=1
Text=PANCHANG FONT COLOR

[PanchangFontColorValue]
Meter=String
X=175
Y=173
W=230
H=25
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
SolidColor=#SettingsInputBackground#
Padding=6,4,6,4
AntiAlias=1
Text=#PANCHANG_FONT_COLOR#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure "MeasureInputPanchangFontColor" "ExecuteBatch 1-2"]

[PanchangFontColorPreview]
Meter=Shape
X=420
Y=173
W=20
H=20
Shape=Rectangle 0,0,20,20 | Fill Color #PANCHANG_FONT_COLOR# | StrokeWidth 1 | Stroke Color 80,80,95,255
DynamicVariables=1

[ConventionLabel]
Meter=String
X=22
Y=236
FontFace=Open Sans
FontSize=10
FontColor=#SettingsLabelColor#
AntiAlias=1
Text=LUNAR MONTH TYPE

[CurrentConventionLabel]
Meter=String
X=22
Y=262
FontFace=Open Sans
FontSize=9
FontColor=#SettingsMutedColor#
AntiAlias=1
Text=CURRENT SELECTION:

[CurrentConventionValue]
Meter=String
X=175
Y=259
W=230
H=18
FontFace=Open Sans
FontSize=10
FontColor=#SettingsValueColor#
AntiAlias=1
Text=#PANCHANG_MONTH_START# (#PANCHANG_REGION#)
DynamicVariables=1

[AmavasyaButton]
Meter=String
X=175
Y=228
W=105
H=30
FontFace=Open Sans
FontSize=10
FontColor=#SettingsValueColor#
SolidColor=70,70,82,255
StringAlign=Center
AntiAlias=1
Text=AMAVASYA
LeftMouseUpAction=[!CommandMeasure "MeasureUpdateAmavasya" "Run"]

[PurnimaButton]
Meter=String
X=300
Y=228
W=105
H=30
FontFace=Open Sans
FontSize=10
FontColor=#SettingsValueColor#
SolidColor=70,70,82,255
StringAlign=Center
AntiAlias=1
Text=PURNIMA
LeftMouseUpAction=[!CommandMeasure "MeasureUpdatePurnima" "Run"]

[ConventionHint]
Meter=String
X=175
Y=283
W=230
FontFace=Open Sans
FontSize=8
FontColor=#SettingsMutedColor#
AntiAlias=1
Text=Amavasya = South | Purnima = North

[SaveButton]
Meter=String
X=22
Y=335
W=183
H=35
FontFace=Open Sans
FontSize=11
FontColor=255,255,255,255
SolidColor=45,145,90,255
StringAlign=Left
Padding=10,0,0,0
AntiAlias=1
Text=SAVE & REFRESH
LeftMouseUpAction=[!CommandMeasure "MeasureUpdatePanchang" "Run"]

[CloseButton]
Meter=String
X=222
Y=335
W=183
H=35
FontFace=Open Sans
FontSize=11
FontColor=255,255,255,255
SolidColor=75,75,88,255
StringAlign=Left
Padding=10,0,0,0
AntiAlias=1
Text=CLOSE
LeftMouseUpAction=[!DeactivateConfig "#CURRENTCONFIG#"]

[Footer]
Meter=String
X=22
Y=390
W=383
FontFace=Open Sans
FontSize=9
FontColor=#SettingsMutedColor#
AntiAlias=1
Text=Use IANA timezone names, for example Asia/Kolkata.
