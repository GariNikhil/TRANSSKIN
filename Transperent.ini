; =========================================================
; CPU HISTOGRAM
; =========================================================

[CPUHistogramUnderline]
Meter=IMAGE
SolidColor=#white#
X=20
Y=299
W=265
H=1

[CPUHistogram]
Meter=Histogram
MeasureName=MeasureCPU
PrimaryColor=#white#
SecondaryColor=#WHITE#
X=20
Y=249
