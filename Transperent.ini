; CPU Bars

[CPU1Bar]
Meter=Bar
MeasureName=MeasureCore1
BarOrientation=HORIZONTAL
BarColor=#white#
X=100
Y=200
W=100
H=3

[CPU2Bar]
Meter=Bar
MeasureName=MeasureCore2
BarOrientation=HORIZONTAL
BarColor=#white#
X=100
Y=212
W=100
H=3

[CPU3Bar]
Meter=Bar
MeasureName=MeasureCore3
BarOrientation=HORIZONTAL
BarColor=#white#
X=100
Y=224
W=100
H=3

[CPU4Bar]
Meter=Bar
MeasureName=MeasureCore4
BarOrientation=HORIZONTAL
BarColor=#white#
X=100
Y=236
W=100
H=3


; CPU Percentages

[CPU1Value]
Meter=String
MeasureName=MeasureCore1
StringAlign=RIGHT
FontFace=Open Sans
FontSize=10
FontColor=#WHITE#
X=277
Y=195
PostFix=%
AntiAlias=1

[CPU2Value]
Meter=String
MeasureName=MeasureCore2
StringAlign=RIGHT
FontFace=Open Sans
FontSize=10
FontColor=#WHITE#
X=277
Y=R
PostFix=%
