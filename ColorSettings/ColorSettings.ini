[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowX=100
WindowY=100
Draggable=1
KeepOnScreen=1
AlwaysOnTop=0
ClickThrough=0
BackgroundMode=2
SolidColor=18,18,22,245
OnRefreshAction=[!Show][!ZPos 0][!Move 100 100 "#CURRENTCONFIG#"][!UpdateMeter *][!Redraw]

[Variables]
@Include=#ROOTCONFIGPATH#\@Settings\Variables.inc

SettingsWidth=430
SettingsHeight=378
SettingsLabelColor=220,220,225,210
SettingsValueColor=255,255,255,255
SettingsMutedColor=180,180,190,190
SettingsAccent=94,169,255,255
SettingsInputBackground=42,42,50,255
SettingsSwatchStroke=90,90,105,255

; Which colour the shared palette edits. Changed by the target rows below.
SelectedIndex=0
SelectedVar=FONT_COLOR
SelectedRefresh=#ROOTCONFIG#
SelectedLabel=FONT COLOR

[MeasureInputFontColor]
Measure=Plugin
Plugin=InputText
X=175
Y=72
W=145
H=25
SolidColor=#SettingsInputBackground#
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
AntiAlias=1
TopMost=0
FocusDismiss=0
DynamicVariables=1
DefaultValue="#FONT_COLOR#"
Command1=[!WriteKeyValue Variables FONT_COLOR "$UserInput$" "#ROOTCONFIGPATH#\@Settings\Variables.inc"]
Command2=[!SetVariable FONT_COLOR "$UserInput$"][!UpdateMeter *][!Redraw][!Refresh "#ROOTCONFIG#"]

[MeasureInputBarColor]
Measure=Plugin
Plugin=InputText
X=175
Y=112
W=145
H=25
SolidColor=#SettingsInputBackground#
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
AntiAlias=1
TopMost=0
FocusDismiss=0
DynamicVariables=1
DefaultValue="#BAR_COLOR#"
Command1=[!WriteKeyValue Variables BAR_COLOR "$UserInput$" "#ROOTCONFIGPATH#\@Settings\Variables.inc"]
Command2=[!SetVariable BAR_COLOR "$UserInput$"][!UpdateMeter *][!Redraw][!Refresh "#ROOTCONFIG#"]

[MeasureInputPanchangColor]
Measure=Plugin
Plugin=InputText
X=175
Y=152
W=145
H=25
SolidColor=#SettingsInputBackground#
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
AntiAlias=1
TopMost=0
FocusDismiss=0
DynamicVariables=1
DefaultValue="#PANCHANG_FONT_COLOR#"
Command1=[!WriteKeyValue Variables PANCHANG_FONT_COLOR "$UserInput$" "#ROOTCONFIGPATH#\@Settings\Variables.inc"]
Command2=[!SetVariable PANCHANG_FONT_COLOR "$UserInput$"][!UpdateMeter *][!Redraw][!Refresh "TRANSSKIN\Panchang"]

[Panel]
Meter=Shape
Shape=Rectangle 0,0,#SettingsWidth#,#SettingsHeight#,10 | Fill Color 18,18,22,245 | StrokeWidth 1 | Stroke Color 80,80,95,255

[Title]
Meter=String
X=22
Y=12
FontFace=Open Sans Light
FontSize=18
FontColor=#SettingsValueColor#
StringStyle=Bold
AntiAlias=1
Text=COLOR SETTINGS

[Subtitle]
Meter=String
X=22
Y=40
FontFace=Open Sans
FontSize=9
FontColor=#SettingsMutedColor#
AntiAlias=1
Text=1. Click a target below.   2. Click a colour in the palette.

[TargetHighlight]
Meter=Shape
X=14
Y=(66 + #SelectedIndex# * 40)
W=402
H=34
Shape=Rectangle 0,0,402,34,6 | Fill Color 94,169,255,36 | StrokeWidth 1 | Stroke Color 94,169,255,90
DynamicVariables=1

[TargetHit0]
Meter=Shape
X=14
Y=66
Shape=Rectangle 0,0,402,25,4 | Fill Color 0,0,0,1
LeftMouseUpAction=[!SetVariable SelectedIndex "0"][!SetVariable SelectedVar "FONT_COLOR"][!SetVariable SelectedRefresh "#ROOTCONFIG#"][!SetVariable SelectedLabel "FONT COLOR"][!UpdateMeter *][!Redraw]

[FontColorLabel]
Meter=String
X=24
Y=71
FontFace=Open Sans
FontSize=10
FontColor=#SettingsLabelColor#
AntiAlias=1
Text=FONT COLOR
LeftMouseUpAction=[!SetVariable SelectedIndex "0"][!SetVariable SelectedVar "FONT_COLOR"][!SetVariable SelectedRefresh "#ROOTCONFIG#"][!SetVariable SelectedLabel "FONT COLOR"][!UpdateMeter *][!Redraw]

[FontColorValue]
Meter=String
X=175
Y=66
W=145
H=25
FontFace=Open Sans
FontSize=11
FontColor=#SettingsValueColor#
SolidColor=#SettingsInputBackground#
Padding=6,4,6,4
AntiAlias=1
Text=#FONT_COLOR#
DynamicVariables=1
LeftMouseUpAction=[!SetVariable SelectedIndex "0"][!SetVariable SelectedVar "FONT_COLOR"][!SetVariable SelectedRefresh "#ROOTCONFIG#"][!SetVariable SelectedLabel "FONT COLOR"][!UpdateMeter *][!Redraw][!CommandMeasure "MeasureInputFontColor" "ExecuteBatch 1-2"]

[FontColorPreview]
