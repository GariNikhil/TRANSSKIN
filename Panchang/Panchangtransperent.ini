[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!UpdateMeasure "MeasureStaleCheck"][!UpdateMeasure "MeasurePanchangDate"]
MiddleMouseDownAction=[!RefreshApp]
ContextTitle=Open Panchang Settings
ContextAction=[!ActivateConfig "TRANSSKIN\PanchangSettings" "PanchangSettings.ini"]
ContextTitle2=Open Color Settings
ContextAction2=[!ActivateConfig "TRANSSKIN\ColorSettings" "ColorSettings.ini"]

[Metadata]
Name=TRANSSKIN
Author=M.NIKHIL
Version=2.0

[Variables]
@Include=#ROOTCONFIGPATH#\@Settings\Variables.inc
@Include2=#@#plugins\PanchangData.inc

; =====================
; Redesigned Layout - Moon & Panchang (Down) & Gregorian Date (Top)
; =====================

; Moon image - far right
[MoonImage]
Meter=IMAGE
ImageName=#@##PanchangMoonImage#
X=150
Y=110
w=70
h=80
SolidColor=0,0,0,1
StringAlign=LEFT
AntiAlias=1
PreserveAspectRatio=2
DynamicVariables=1

; Location
[PanchangLocation]
Meter=String
X=150
Y=190
FontFace=Open Sans
FontSize=10
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=LEFT
ClipString=1
AntiAlias=1
Text=Anantapur, India

; Panchang section - Down side
; Line 1: Tithi with end time
[PanchangLine1]
Meter=String
X=227
Y=110
FontFace=Open Sans
FontSize=11
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=LIFT
AntiAlias=1
AutoScale=1
Text=#PanchangTithi# (End at #PanchangTithiEnd#)

; Line 2: Weekday + Paksha
[PanchangLine2]
Meter=String
X=227
Y=130
FontFace=Open Sans
FontSize=11
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=LEFT
AntiAlias=1
AutoScale=1
Text=#PanchangWeekday#, #PanchangPaksha# Paksha

; Line 3: Month + Ritu
[PanchangLine3]
Meter=String
X=227
Y=150
FontFace=Open Sans
FontSize=11
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=Left
AntiAlias=1
AutoScale=1
Text=#PanchangMonth# Masa, #PanchangRitu# Ritu

; Line 4: Samvatsara + Samvat
[PanchangLine4]
Meter=String
X=227
Y=170
FontFace=Open Sans
FontSize=11
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=Left
AntiAlias=1
AutoScale=1
Text=#PanchangSamvatsara# Samvatsara, #PanchangSamvat#

; =====================
; Gregorian date - Top side
; =====================

; Time line
[GregorianTime]
Meter=String
MeasureName=Measure24HrTime
X=226
Y=0
FontFace=Open Sans
FontSize=35
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=LEFT
AutoScale=1
AntiAlias=1

; Date line
[GregorianDate]
Meter=String
MeasureName=MeasureDate
X=290
Y=45
FontFace=Open Sans
FontSize=15
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=CENTER
AntiAlias=1
AutoScale=1
Bold=1

; Day line
[GregorianDay]
Meter=String
MeasureName=MeasureDay
X=235
Y=65
FontFace=Open Sans
FontSize=15
FontColor=#PANCHANG_FONT_COLOR#
DynamicVariables=1
StringAlign=LEFT
AntiAlias=1
AutoScale=1
Bold=1

; Data status - only visible when the data is stale or unavailable
[PanchangStatus]
Meter=String
X=150
Y=212
FontFace=Open Sans
FontSize=8
FontColor=#BRIGHTRED#
DynamicVariables=1
StringAlign=LEFT
ClipString=1
AntiAlias=1
Hidden=[MeasureStatusHidden]
Text=#PanchangStatus#

; -------------------------
; Time
; -------------------------

[Measure24HrTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%B %#d, %Y

[MeasureDay]
Measure=Time
Format=%A

; -------------------------
; Self-update
; -------------------------

; Regenerates the data files, then refreshes this config on success only.
[MeasurePanchangUpdate]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#ROOTCONFIGPATH#\tools\panchang\update-panchang.ps1" -RefreshRainmeter -RefreshConfig TRANSSKIN\Panchang
State=Hide

; Checks the stale flag on load, then hourly while the data stays stale.
[MeasureStaleCheck]
Measure=Calc
Formula=#PanchangIsStale#
UpdateDivider=7200
IfCondition=MeasureStaleCheck = 1
IfTrueAction=[!CommandMeasure "MeasurePanchangUpdate" "Run"]

; The generated data is only ever written for the day it was calculated, so the
; date it carries is the signal that a new day's panchang is due. Mismatching the
; current date retries hourly at most, which bounds the work if a run fails.
[MeasurePanchangDate]
Measure=Time
Format=%Y-%m-%d
UpdateDivider=7200
IfMatch=^#PanchangDate#$
IfNotMatchAction=[!CommandMeasure "MeasurePanchangUpdate" "Run"]

; Inverts the stale flag: the status label is hidden while the data is healthy.
[MeasureStatusHidden]
Measure=Calc
Formula=1 - #PanchangIsStale#
DynamicVariables=1
